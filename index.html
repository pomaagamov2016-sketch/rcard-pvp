<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RCard PvP — Web Demo</title>
<style>
:root{--gold:#ffc75a;--panel:#172a31;--deep:#08141b;--text:#f6f1e6}
*{box-sizing:border-box}body{margin:0;background:#08141b;color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.app{width:min(100vw,480px);min-height:100dvh;margin:auto;position:relative;isolation:isolate;overflow:hidden;background:#08141b;padding-bottom:76px}.app::before{content:"";position:absolute;z-index:-1;inset:0;background:linear-gradient(#07131b18,#08141b20),url("menu-village.jpg") center top / 100% auto repeat-y;pointer-events:none}
/* Улучшенная графика: глубина сцены, подсветка и мягкие контуры */
.app{filter:saturate(1.08)}
.village{filter:contrast(1.06) saturate(1.12);transform:translateZ(0)}
.panel{box-shadow:0 8px 24px #0003,inset 0 1px #ffffff0b;backdrop-filter:blur(5px)}
.primary,.secondary,button{transition:transform .18s ease,filter .18s ease,box-shadow .18s ease}
button:hover{filter:brightness(1.12);box-shadow:0 0 14px #9fdfff22}button:active{transform:scale(.98)}
/* EVO — ультраредкая, выше легендарной */
.case-item.evo,.crystal-reward-card.evo,.case-result.evo-result{border:2px solid #b7fff7!important;background:radial-gradient(ellipse at 50% 0%,#1b6d70,#16143c 55%,#090b1a)!important;box-shadow:0 0 18px #48ffe8aa,0 0 38px #9d54ff55,inset 0 0 24px #4bfff933!important;position:relative;overflow:hidden}
.case-item.evo:before,.crystal-reward-card.evo:before,.case-result.evo-result:before{content:"";position:absolute;inset:-60%;background:conic-gradient(from 0deg,transparent 0 12%,#bfffff55 16%,transparent 22% 40%,#d6a5ff66 45%,transparent 52% 70%,#71fff066 76%,transparent 82%);animation:evo-spin 4s linear infinite;pointer-events:none}
.case-item.evo>* ,.crystal-reward-card.evo>* ,.case-result.evo-result>*{position:relative;z-index:1}
.evo-label{font-weight:1000;letter-spacing:3px;color:#d6fffb;text-shadow:0 0 8px #5dfff2,0 0 20px #9c5bff;animation:evo-pulse .8s ease-in-out infinite alternate}
.evo-result .case-result-icon,.crystal-reward-card.evo .crystal-card-icon{filter:drop-shadow(0 0 12px #71fff5) drop-shadow(0 0 28px #a96bff);animation:evo-float 1s ease-in-out infinite alternate}
@keyframes evo-spin{to{transform:rotate(360deg)}}@keyframes evo-pulse{to{filter:brightness(1.6);letter-spacing:4px}}@keyframes evo-float{to{transform:translateY(-5px) scale(1.08)}}
/* Обновлённый вид экипировки: предметы читаются как конкретные доспехи и оружие */
.gear-art{width:76px;height:76px;display:grid;place-items:center;position:relative;border-radius:18px;background:linear-gradient(145deg,#233d4a,#0a151f);border:1px solid #7193a5;box-shadow:inset 0 0 18px #72dfff18,0 6px 14px #0005;margin-bottom:3px}
.gear-art .gear-art-icon{font-size:45px;line-height:1;filter:drop-shadow(0 5px 4px #0008) drop-shadow(0 0 7px #6bdcff55);transform:rotate(-8deg)}
.gear-art.weapon .gear-art-icon{font-size:49px;transform:rotate(-28deg) scale(1.06)}
.gear-art.armor .gear-art-icon{font-size:48px}.gear-art.helmet .gear-art-icon{font-size:47px}.gear-art.pants .gear-art-icon{font-size:44px}.gear-art.boots .gear-art-icon{font-size:43px}
.gear-art.evo{border:2px solid #aafff5;background:radial-gradient(circle at 50% 20%,#247a83,#1c1741 62%,#080d18);box-shadow:0 0 14px #50fff0a8,0 0 30px #9a59ff55,inset 0 0 18px #9dfff455;animation:evo-float 1.25s ease-in-out infinite alternate}
.gear-art.evo:before{content:"";position:absolute;inset:4px;border:1px solid #d6fffb88;border-radius:14px;transform:rotate(45deg) scale(.72);box-shadow:0 0 12px #7fffff77;pointer-events:none}
.gear-art.evo:after{content:"EVO";position:absolute;bottom:-7px;right:-5px;padding:2px 5px;border-radius:6px;background:linear-gradient(90deg,#83fff0,#c49aff);color:#101329;font-size:9px;font-weight:1000;letter-spacing:1px;box-shadow:0 0 10px #7fffff88}
.crystal-reward-card.gear-reward{padding:14px 8px 12px;min-height:205px;justify-content:flex-start;background:linear-gradient(150deg,#1b3543,#101623)}
.crystal-reward-card.gear-reward.evo{background:radial-gradient(ellipse at 50% 0%,#245b68,#20153f 58%,#080b16)!important}
.crystal-reward-card.gear-reward b{text-align:center}.crystal-reward-card.gear-reward small{text-align:center}
.bag-item-card.gear-inventory-item{position:relative;overflow:hidden;background:linear-gradient(125deg,#142b39ee,#0a151fef)}
.bag-item-card.gear-inventory-item .bag-item-icon{width:58px;height:64px;border:1px solid #6b9bad;background:linear-gradient(145deg,#24414e,#0a141d);font-size:37px;filter:drop-shadow(0 4px 5px #0007)}
.bag-item-card.gear-inventory-item.evo{border:1px solid #9cfff3!important;box-shadow:0 0 18px #49f9e955,inset 0 0 24px #8052ff22;background:linear-gradient(115deg,#173d46,#1d1538 60%,#0a121d)}
.bag-item-card.gear-inventory-item.evo .bag-item-icon{border-color:#a8fff5;box-shadow:0 0 15px #66fff055;animation:evo-float 1.4s ease-in-out infinite alternate}
.bag-item-card.evo .rarity{color:#bafff7;text-shadow:0 0 8px #4dfff0}
.equipment-slot.evo-equipped{border-color:#aafff5;background:radial-gradient(ellipse at 50% 0%,#20565d,#21163b 72%,#0b1820);box-shadow:0 0 18px #5cfff044,inset 0 0 20px #ac8bff22}
.equipment-slot .slot-art{width:68px;height:68px;margin:0 auto 8px;display:grid;place-items:center;border-radius:17px;background:linear-gradient(145deg,#244653,#0a151f);border:1px solid #648c9c;box-shadow:inset 0 0 15px #7ce5ff14,0 4px 12px #0005}
.equipment-slot .slot-art span{font-size:42px;filter:drop-shadow(0 4px 4px #0008) drop-shadow(0 0 7px #7deaff55)}
.equipment-slot.evo-equipped .slot-art{border:2px solid #aafff5;box-shadow:0 0 18px #5cfff077,inset 0 0 18px #b7fff544;animation:evo-float 1.2s ease-in-out infinite alternate}
@media(prefers-reduced-motion:reduce){.gear-art.evo,.equipment-slot.evo-equipped .slot-art,.bag-item-card.gear-inventory-item.evo .bag-item-icon{animation:none}}
/* Дополнительная атмосферная глубина погодных режимов */
.app.weather-rain .weather-layer{backdrop-filter:blur(.45px) saturate(.9)}
.app.weather-storm .weather-layer{background-image:linear-gradient(180deg,#07152c55,#07152522 40%,#030a1a66);}
.app.weather-sun .weather-layer{filter:saturate(1.2)}
.app.weather-fog .village{filter:blur(.6px) saturate(.72)}
.app.weather-moon .village{filter:brightness(.72) saturate(.78) contrast(1.12)}
.app.weather-clouds .weather-layer{filter:saturate(.8)}
/* Улучшенные многослойные погодные эффекты для главного меню */
.weather-layer{position:absolute;z-index:1;inset:0;overflow:hidden;pointer-events:none;opacity:0;transition:opacity .65s ease;isolation:isolate}
.weather-layer:before,.weather-layer:after{content:"";position:absolute;inset:0;pointer-events:none}
/* Объёмный дождь рисуется на canvas: мягкие капли с бликом, глубиной и брызгами, без повторяющихся полос */
.weather-rain-canvas{position:absolute;inset:0;width:100%;height:100%;display:none;pointer-events:none;z-index:1}
.app.weather-rain .weather-layer,.app.weather-storm .weather-layer{background-image:linear-gradient(180deg,#10243a20,transparent 42%,#07142138);}
.app.weather-rain .weather-layer{opacity:.96}
.app.weather-rain .weather-layer:before{background:linear-gradient(180deg,#102e4c15,transparent 38%,#0b1b2c30);box-shadow:inset 0 0 65px #07172c35}
.app.weather-rain .weather-layer:after{background:radial-gradient(ellipse at 50% 60%,transparent 25%,#07172c18 100%)}
.app.weather-storm .weather-layer{opacity:1;background-image:linear-gradient(180deg,#101a3c55,#07152535)}
.app.weather-storm .weather-layer:before{background:linear-gradient(155deg,transparent 0 39%,#d9efff 39.2% 39.7%,transparent 40% 100%);opacity:0;animation:lightning-flash 8s infinite;filter:drop-shadow(0 0 12px #d8edff)}
.app.weather-storm .weather-layer:before{background:linear-gradient(155deg,transparent 0 39%,#d9efff 39.2% 39.7%,transparent 40% 100%);opacity:0;animation:lightning-flash 8s infinite;filter:drop-shadow(0 0 12px #d8edff)}
.app.weather-storm .weather-layer:after{background:#eaf6ff;opacity:0;animation:lightning-flash 8s infinite;mix-blend-mode:screen}
/* Солнце: светящийся диск, лучи и тёплое атмосферное свечение */
.app.weather-sun .weather-layer{opacity:1;background:radial-gradient(circle at 84% 9%,#fffbe8 0 13px,#fff5bd 14px 21px,#ffe59a55 22px 45px,transparent 75px),conic-gradient(from 10deg at 84% 9%,transparent 0 8deg,#fff2 9deg 10deg,transparent 11deg 24deg,#fff2 25deg 26deg,transparent 27deg 43deg,#fff2 44deg 45deg,transparent 46deg 64deg,#fff2 65deg 66deg,transparent 67deg 100deg),linear-gradient(180deg,#ffdf8a15,transparent 48%)}
.app.weather-sun .weather-layer:before{background:linear-gradient(115deg,transparent 25%,#fff2 42%,transparent 46%),linear-gradient(130deg,transparent 55%,#fff3 57%,transparent 59%);animation:sun-glow 6s ease-in-out infinite alternate}
/* Луна: ночь заметно темнее, серебристый диск и мягкий лунный свет на фоне */
.app.weather-moon .weather-layer{opacity:1;background:linear-gradient(180deg,#050b20a8 0%,#09152e7d 42%,#07101f9c 100%),radial-gradient(ellipse at 82% 12%,#c7dcff25 0,transparent 30%),radial-gradient(circle at 82% 9%,#fffef0 0 15px,#e5e9df 16px 19px,#c9dcff66 20px 29px,#9db9ff20 30px 54px,transparent 76px),radial-gradient(circle at 79% 7%,#fff 0 1px,transparent 2px),radial-gradient(circle at 91% 16%,#fff 0 1.5px,transparent 2.5px),radial-gradient(circle at 67% 12%,#dfeaff 0 1px,transparent 2px),radial-gradient(circle at 48% 6%,#fff 0 1px,transparent 2px),radial-gradient(circle at 28% 18%,#fff 0 1px,transparent 2px)}
.app.weather-moon .weather-layer:before{background:radial-gradient(ellipse at 82% 12%,#b7d0ff25 0,transparent 29%),linear-gradient(158deg,transparent 0 17%,#d7e5ff08 25%,#c8dcff16 36%,#d7e5ff08 48%,transparent 61%),radial-gradient(ellipse at 78% 28%,#b5ceff12,transparent 44%);transform-origin:82% 10%;animation:moon-breathe 5s ease-in-out infinite alternate}
.app.weather-moon .weather-layer:after{background:linear-gradient(180deg,#03081718,#02071425),radial-gradient(ellipse at 82% 10%,#e2edff16 0,transparent 19%);box-shadow:inset 0 0 90px #02071355;animation:moon-breathe 7s ease-in-out infinite alternate-reverse}
/* Туман: несколько полупрозрачных полос, движущихся на разной скорости */
.app.weather-fog .weather-layer{opacity:.94;background:linear-gradient(180deg,#b9d0d733,#dce6e877 40%,#d3e0dd66 70%,#b7c9cc55);backdrop-filter:blur(2px)}
.app.weather-fog .weather-layer:before{inset:10% -45%;background:repeating-linear-gradient(0deg,transparent 0 34px,#f4f8f2a0 45px 76px,transparent 91px 132px);filter:blur(12px);animation:fog-drift 13s ease-in-out infinite alternate}
.app.weather-fog .weather-layer:after{inset:38% -35%;background:linear-gradient(90deg,transparent,#edf4f0a8 28%,#f8faf5b5 53%,transparent 86%);filter:blur(17px);animation:fog-drift 19s ease-in-out infinite alternate-reverse}
/* Облака: мягкие многослойные облачные массы */
.app.weather-clouds .weather-layer{opacity:.92;background:radial-gradient(ellipse 100px 34px at 14% 13%,#fff9 0 42%,#e8f2f2a8 58%,transparent 75%),radial-gradient(ellipse 115px 43px at 24% 12%,#f8fbf8ee 0 35%,#e5eeeeaa 61%,transparent 76%),radial-gradient(ellipse 120px 39px at 63% 19%,#f7faf9d9 0 40%,#e1e9edaa 62%,transparent 77%),radial-gradient(ellipse 95px 32px at 79% 16%,#fff9 0 40%,transparent 75%),radial-gradient(ellipse 150px 50px at 105% 25%,#eef4f5cc 0 44%,transparent 75%);animation:cloud-drift 20s ease-in-out infinite alternate}
.app.weather-clouds .weather-layer:before{background:radial-gradient(ellipse 130px 42px at 45% 8%,#fff5 0 45%,transparent 75%),radial-gradient(ellipse 100px 30px at 4% 26%,#fff6 0 40%,transparent 75%);filter:blur(3px);animation:cloud-drift 28s ease-in-out infinite alternate-reverse}
@keyframes rain-fall{from{background-position:0 -20px,0 -40px}to{background-position:-35px 150px,-50px 190px}}
@keyframes lightning-flash{0%,89%,91%,94%,100%{opacity:0}90%,92%{opacity:.78}}
@keyframes fog-drift{from{transform:translateX(-5%)}to{transform:translateX(5%)}}
@keyframes cloud-drift{from{transform:translateX(-4%)}to{transform:translateX(4%)}}
@keyframes sun-glow{from{opacity:.5}to{opacity:1}}
@keyframes moon-breathe{from{opacity:.4}to{opacity:1}}
/* Дополнительная глубина атмосферы: дальние слои, световые объёмы и движение */
.weather-depth{position:absolute;inset:-8%;z-index:0;pointer-events:none;opacity:0;transition:opacity .8s ease;mix-blend-mode:screen}
.app.weather-sun .weather-depth{opacity:1;background:radial-gradient(ellipse at 84% 9%,#fff7c65c 0,transparent 22%),conic-gradient(from 150deg at 84% 9%,transparent 0deg,#fff2 8deg,transparent 17deg,transparent 27deg,#fff1 35deg,transparent 45deg,transparent 66deg,#fff2 73deg,transparent 82deg);animation:sun-volume 9s ease-in-out infinite alternate}
.app.weather-rain .weather-depth{opacity:.8;background:linear-gradient(115deg,transparent 8%,#a5d9ff08 24%,transparent 38%),linear-gradient(72deg,transparent 55%,#c4e7ff0a 68%,transparent 78%),radial-gradient(ellipse at 50% 85%,#7aa8c51c,transparent 55%)}
.app.weather-storm .weather-depth{opacity:1;background:radial-gradient(ellipse at 70% 22%,#8eabff18,transparent 34%),linear-gradient(165deg,transparent 18%,#b6d9ff0a 40%,transparent 52%);animation:storm-atmosphere 8s ease-in-out infinite}
.app.weather-moon .weather-depth{opacity:1;background:radial-gradient(ellipse at 82% 12%,#d6e5ff3b 0,transparent 27%),conic-gradient(from 145deg at 82% 12%,transparent 0deg,#dbe8ff12 18deg,transparent 32deg,transparent 52deg,#dbe8ff0c 66deg,transparent 83deg),radial-gradient(ellipse at 70% 55%,#7eabff0a,transparent 58%);animation:moon-rays 8s ease-in-out infinite alternate}
.app.weather-fog .weather-depth{opacity:.92;background:linear-gradient(180deg,transparent 12%,#edf5f3a0 35%,#e8f2f155 47%,transparent 59%),linear-gradient(0deg,#d6e5e633,transparent 48%);filter:blur(13px);animation:fog-depth 17s ease-in-out infinite alternate}
.app.weather-clouds .weather-depth{opacity:.95;background:radial-gradient(ellipse 180px 65px at 18% 19%,#f7fbf8a0 0 28%,#dce8ed75 48%,transparent 73%),radial-gradient(ellipse 220px 72px at 76% 29%,#f6f9f9a0 0 27%,#d9e4ed55 49%,transparent 72%),radial-gradient(ellipse 180px 55px at 48% 9%,#fff7 0 25%,transparent 72%);filter:blur(5px);animation:cloud-depth 27s ease-in-out infinite alternate}
@keyframes sun-volume{from{transform:translate(-1%,0) scale(1);opacity:.55}to{transform:translate(1%,1%) scale(1.05);opacity:1}}
@keyframes storm-atmosphere{0%,100%{opacity:.35;transform:translateX(-1%)}50%{opacity:.9;transform:translateX(1%)}}
@keyframes moon-rays{from{transform:scale(1);opacity:.55}to{transform:scale(1.06);opacity:1}}
@keyframes fog-depth{from{transform:translateX(-6%) translateY(1%)}to{transform:translateX(7%) translateY(-2%)}}
@keyframes cloud-depth{from{transform:translateX(-5%) translateY(0)}to{transform:translateX(5%) translateY(2%)}}
@media(prefers-reduced-motion:reduce){.weather-depth,.weather-layer,.weather-layer:before,.weather-layer:after{animation-duration:8s}}
.sky{display:none;height:34vh;min-height:210px;position:absolute;inset:0 0 auto;background:linear-gradient(#69bdce,#c4d9c1);z-index:0}
.mountain{display:none;position:absolute;top:20vh;left:-15%;width:130%;height:24vh;background:#617e72;clip-path:polygon(0 100%,10% 50%,18% 67%,31% 5%,46% 68%,58% 22%,72% 73%,84% 17%,100% 100%);opacity:.8}
.village{display:none;position:absolute;top:31vh;left:0;right:0;height:30vh;background:linear-gradient(transparent,#173c31)}
.hud{position:relative;z-index:3;background:#07131beF;padding:10px;display:grid;grid-template-columns:52px 1fr auto;gap:8px;align-items:center;border-bottom:1px solid #c58c3c}
.settings-quick{position:absolute;right:9px;top:9px;width:32px;height:32px;padding:0;border:1px solid #c9954c;border-radius:7px;background:#18313a;color:#ffe0a0;font-size:17px;display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 5px #0007;z-index:4}.mail-quick{position:absolute;right:9px;top:47px;width:32px;height:32px;padding:0;border:1px solid #79c7e8;border-radius:7px;background:linear-gradient(145deg,#1d5365,#142b3a);color:#e6f8ff;font-size:17px;display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 8px #0008;z-index:4}.mail-quick.has-unread{animation:mail-pulse 2s ease-in-out infinite}.mail-badge{position:absolute;right:-5px;top:-5px;min-width:15px;height:15px;padding:0 3px;border-radius:9px;background:#e64b3e;color:white;font-size:9px;font-weight:900;display:grid;place-items:center;border:1px solid #ffe0c0}.mail-card{display:grid;grid-template-columns:42px 1fr;gap:10px;padding:12px;margin:9px 0;border:1px solid #466574;border-radius:12px;background:linear-gradient(125deg,#1b3544,#101e2b)}.mail-card.unread{border-color:#69c8ed;box-shadow:inset 0 0 18px #39b9ff12}.mail-card.claimed{opacity:.65}.mail-icon{font-size:29px;display:grid;place-items:center}.mail-card h3{margin:0 0 4px;font-size:14px;color:#ffe0a0}.mail-card p{margin:0 0 8px;font-size:12px;color:#c9d9e0}.mail-meta{font-size:10px;color:#89b9ca;margin-bottom:7px}.mail-action{border:1px solid #73c9ec;border-radius:8px;background:#173e50;color:#e8f8ff;padding:7px 10px;font-weight:800;cursor:pointer}.mail-action:disabled{opacity:.65;cursor:default}@keyframes mail-pulse{0%,100%{box-shadow:0 2px 8px #0008,0 0 0 #5bd6ff00}50%{box-shadow:0 2px 8px #0008,0 0 14px #5bd6ff99}}.curr{padding-right:35px}.avatar{overflow:visible;flex-shrink:0;position:relative}.avatar img{border-radius:8px;overflow:hidden}.avatar-frame-bronze{border:3px solid #bd8750!important;box-shadow:0 0 0 2px #59351e,0 0 10px #d49a4b66!important;background:linear-gradient(135deg,#6b3e24,#e3b66d,#6b3e24)!important}.avatar-frame-silver{border:3px solid #d9e5f2!important;box-shadow:0 0 0 2px #647d99,0 0 12px #9fd7ff99!important;background:linear-gradient(135deg,#647b91,#f0f8ff,#6d8da7)!important}.avatar-frame-emerald{border:3px solid #63efbd!important;box-shadow:0 0 0 2px #145747,0 0 14px #37ffc488!important;background:linear-gradient(135deg,#0c5b4a,#8bffd2,#14513e)!important}.avatar-frame-arcane{border:3px solid #c78aff!important;box-shadow:0 0 0 2px #542d84,0 0 15px #a855f7bb!important;background:linear-gradient(135deg,#43206c,#e3a4ff,#522c88)!important}.avatar-frame-legendary{border:3px solid #ffe38a!important;box-shadow:0 0 0 2px #8c5419,0 0 7px #ffd45a,0 0 20px #ffad28aa!important;background:conic-gradient(from 0deg,#fff0a1,#b96b19,#fff0a1,#6f3b10,#fff0a1)!important;animation:frame-legendary-glow 2s ease-in-out infinite alternate}@keyframes frame-legendary-glow{from{filter:drop-shadow(0 0 3px #ffbd3e)}to{filter:drop-shadow(0 0 10px #fff0a1)}}.avatar img,.profile-big-avatar img{width:100%;height:100%;object-fit:cover;display:block}.avatar{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,#b75b31,#f2bf63);display:grid;place-items:center;font-size:27px;border:2px solid var(--gold)}
.brand{font-weight:900;letter-spacing:1px;font-size:15px}.sub{font-size:11px;color:#bed1d4}.curr{font-size:12px;text-align:right;color:var(--gold);line-height:1.8;white-space:nowrap}
.content{position:relative;z-index:2;padding:12px 12px 20px;background:linear-gradient(#07131b24,#07131b30)}.title{text-align:center;font-weight:900;letter-spacing:1px;font-size:23px;text-shadow:0 2px 3px #14201b}.subtitle{text-align:center;font-size:13px;color:#f1f2d8;margin:3px 0 12px}
.village-art{display:none!important;height:0;position:relative;margin:0}
.pagoda{width:160px;height:145px;position:relative;filter:drop-shadow(0 8px 5px #0b241c88)}
.roof{position:absolute;left:0;width:100%;height:30px;background:#a84c24;clip-path:polygon(0 75%,15% 40%,28% 0,72% 0,85% 40%,100% 75%,78% 68%,65% 48%,35% 48%,22% 68%);border-bottom:2px solid #f5bc58}
.roof.r1{top:5px}.roof.r2{top:48px;transform:scale(.82);left:9%}.roof.r3{top:91px;transform:scale(.68);left:16%}
.tower{position:absolute;top:19px;bottom:0;left:25%;width:50%;background:repeating-linear-gradient(90deg,#d4b77a 0 10px,#7b4b31 10px 13px);border:4px solid #70452d}
.door{position:absolute;bottom:0;left:38%;width:24%;height:38px;background:#30251e;border:3px solid #e6bd6a;border-bottom:0}
.tree{position:absolute;bottom:20px;font-size:76px;filter:drop-shadow(0 4px 2px #13251c)}.tree.left{left:0}.tree.right{right:0}
.feature-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.feature{min-height:76px;border:1px solid #b98540;border-radius:10px;background:linear-gradient(135deg,#203d42ed,#10232bed);color:white;padding:10px;text-align:left;box-shadow:0 3px 0 #071218;cursor:pointer}
.feature strong{display:block;color:var(--gold);font-size:13px}.feature span{font-size:11px;color:#d1ddda}.feature .ico{float:left;font-size:23px;margin-right:8px}.wide{grid-column:1/-1}
.team-title{text-align:center;color:var(--gold);font-weight:800;margin:14px 0 8px;font-size:13px}.team{display:flex;gap:5px}.hero-chip{flex:1;min-width:0;text-align:center;border:1px solid #b9843e;border-radius:8px;background:#493323;padding:7px 2px;font-size:10px;font-weight:800}.hero-chip small{display:block;color:#f5d8a2;font-size:9px}
.primary{width:100%;margin-top:12px;border:0;border-radius:10px;padding:14px;background:linear-gradient(#e45b34,#9b2f20);color:#fff;font-weight:900;font-size:16px;box-shadow:0 4px 0 #5b1e19;cursor:pointer}
.nav{position:fixed;z-index:5;bottom:0;left:50%;transform:translateX(-50%);width:min(100vw,480px);height:70px;background:#07131bf5;border-top:1px solid #bc8845;display:grid;grid-template-columns:repeat(5,1fr);padding:5px 2px}
.nav button{background:transparent;border:0;color:#c6d0cf;font-size:10px;font-weight:700;cursor:pointer}.nav button b{display:block;font-size:22px;margin-bottom:1px}.nav button.active{color:var(--gold)}
.panel{background:#11262eeb;border:1px solid #b98540;border-radius:12px;padding:14px;margin-top:12px}.hero-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:#203840;border-radius:8px;padding:10px;margin:7px 0}.rarity{font-size:10px;color:var(--gold)}.hero-row button,.secondary{background:#bd7833;border:0;border-radius:7px;padding:8px 10px;color:#fff;font-weight:800}
.log{white-space:pre-line;line-height:1.7;font-size:14px}.bar{height:9px;background:#512a2b;border-radius:9px;overflow:hidden;margin:5px 0 10px}.bar i{display:block;height:100%;background:#e35d50}.notice{position:fixed;z-index:9;inset:0;background:#0009;display:grid;place-items:center;padding:22px}.notice>div{width:min(100%,400px);background:#13272f;border:1px solid var(--gold);border-radius:14px;padding:20px;text-align:center}.notice h2{color:var(--gold);margin-top:0}

/* Портреты ниндзя и анимация ударов */
.portrait{width:62px;height:62px;min-width:62px;border-radius:15px;display:grid;place-items:center;font-size:34px;background:linear-gradient(145deg,#46567d,#151b30);border:2px solid #e9bd63;box-shadow:inset 0 0 14px #ffffff12;position:relative}
.fighter-line{display:flex;align-items:center;justify-content:space-around;gap:8px;margin:14px 0}
.fighter{width:43%;text-align:center;position:relative;transition:transform .24s ease}
.fighter .portrait{width:78px;height:78px;margin:0 auto 7px;font-size:44px}
.fighter-name{font-weight:900;font-size:12px}
.fighter-hp{height:9px;background:#34394a;border-radius:99px;overflow:hidden;margin:6px 0}
.fighter-hp i{display:block;height:100%;background:#61d48b;transition:width .25s}
.fighter.enemy .fighter-hp i{background:#ff6879}
.vs-mark{font-size:20px;font-weight:1000;color:#f4c86a}
.fighter.attacking{transform:translateX(17px) scale(1.08)}
.fighter.enemy.attacking{transform:translateX(-17px) scale(1.08)}
.fighter.hit{animation:hitShake .3s}
.damage-pop{position:absolute;left:50%;top:4px;transform:translateX(-50%);font-size:23px;font-weight:1000;color:#ffe27c;text-shadow:0 2px 5px #000;animation:damageFloat .7s forwards;pointer-events:none}
@keyframes hitShake{0%,100%{filter:none}30%{filter:brightness(2);transform:translateX(-4px)}70%{filter:brightness(1.5);transform:translateX(4px)}}
@keyframes damageFloat{from{opacity:1;top:5px}to{opacity:0;top:-28px}}
.team-portrait{display:flex;align-items:center;gap:8px;background:#ffffff09;border-radius:10px;padding:6px;margin:5px 0}
.team-portrait .portrait{width:42px;height:42px;min-width:42px;font-size:24px;border-radius:10px}
.battle-log{min-height:72px;max-height:125px;overflow:auto;background:#0a1520;border-radius:10px;padding:11px;line-height:1.55;font-size:13px}


.avatar-choice{cursor:pointer;transition:transform .12s}.avatar-choice:active{transform:scale(.93)}.profile-trigger{cursor:pointer;color:inherit;padding:0;transition:transform .15s,filter .15s}
.profile-trigger:active{transform:scale(.94);filter:brightness(1.2)}
.profile-modal{position:fixed;z-index:20;inset:0;background:#02070bdc;display:grid;place-items:center;padding:18px;backdrop-filter:blur(5px)}
.profile-card{width:min(100%,390px);max-height:88vh;overflow:auto;background:linear-gradient(160deg,#18343b,#0a1722);border:1px solid #e7b85d;border-radius:20px;box-shadow:0 20px 70px #000b;padding:18px;color:#f5f2e8}
.profile-top{display:flex;align-items:center;gap:14px;margin:4px 0 18px}
.profile-big-avatar{width:78px;height:78px;flex-shrink:0;position:relative;border-radius:20px;display:grid;place-items:center;font-size:46px;background:linear-gradient(135deg,#a8482d,#f0c86b);border:3px solid #e8ba60}
.profile-stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0}
.profile-stat{background:#ffffff0a;border:1px solid #ffffff13;border-radius:12px;padding:12px}
.profile-stat b{display:block;color:#f3c768;font-size:19px;margin-top:4px}
.profile-section{border-top:1px solid #ffffff20;padding-top:12px;margin-top:12px}
.profile-close{width:100%;margin-top:14px}



/* Расширенная кинематографичная анимация открытия сундуков */
.case-overlay.chest-cinematic{isolation:isolate;overflow:hidden;animation:chest-scene-in .45s ease-out both}
.case-overlay.chest-cinematic:after{content:"";position:absolute;z-index:-1;inset:-35%;pointer-events:none;background:conic-gradient(from 0deg,transparent 0 7%,var(--chest-aura,#ffd36b22) 9%,transparent 13% 24%,var(--chest-aura,#ffd36b22) 27%,transparent 31% 43%,var(--chest-aura,#ffd36b22) 46%,transparent 50%);animation:chest-portal-spin 13s linear infinite;mask-image:radial-gradient(ellipse at center,#000 0 30%,transparent 70%)}
.case-overlay.chest-cinematic .case-opening-art{position:relative;z-index:1;animation:chest-charge-up .85s cubic-bezier(.2,.8,.2,1) both,case-chest-charge 1.1s ease-in-out .85s infinite alternate}
.case-overlay.chest-cinematic .case-opening-art:before{content:"";position:absolute;z-index:-1;left:50%;top:50%;width:1.8em;height:1.8em;border:2px solid var(--chest-ring,#ffd36b);border-radius:50%;transform:translate(-50%,-50%) scale(.2);box-shadow:0 0 25px var(--chest-ring,#ffd36b),inset 0 0 20px var(--chest-ring,#ffd36b);animation:chest-shockwave 1.35s ease-out infinite}
.case-overlay.chest-cinematic .case-heading{animation:chest-heading-arrive .65s cubic-bezier(.2,1.3,.3,1) both}
.case-overlay.chest-cinematic .crystal-results-grid,.case-overlay.chest-cinematic .case-track-wrap{position:relative;z-index:2}
.case-overlay.chest-cinematic .case-subtitle{animation:chest-subtitle-in .55s ease-out both}
.chest-fx-spark{position:fixed;z-index:33;left:var(--x);top:var(--y);width:var(--size);height:var(--size);border-radius:50%;pointer-events:none;background:radial-gradient(circle,#fff 0 8%,var(--spark-color) 30%,transparent 72%);filter:drop-shadow(0 0 7px var(--spark-color));animation:chest-spark-fly var(--dur) cubic-bezier(.12,.65,.25,1) forwards}
.chest-fx-spark:after{content:"";position:absolute;left:45%;top:-160%;width:10%;height:420%;background:linear-gradient(transparent,#fff,var(--spark-color),transparent);transform:rotate(35deg)}
@keyframes chest-scene-in{from{opacity:0;filter:brightness(.4) blur(5px)}to{opacity:1;filter:brightness(1) blur(0)}}
@keyframes chest-portal-spin{to{transform:rotate(360deg)}}
@keyframes chest-charge-up{0%{transform:translateY(35px) scale(.35);filter:brightness(.4) drop-shadow(0 0 0 var(--chest-ring,#ffd36b))}65%{transform:translateY(-8px) scale(1.18);filter:brightness(1.8) drop-shadow(0 0 35px var(--chest-ring,#ffd36b))}100%{transform:translateY(0) scale(1);filter:brightness(1.2) drop-shadow(0 0 24px var(--chest-ring,#ffd36b))}}
@keyframes chest-shockwave{0%{opacity:.9;transform:translate(-50%,-50%) scale(.2)}100%{opacity:0;transform:translate(-50%,-50%) scale(2.6)}}
@keyframes chest-heading-arrive{from{opacity:0;transform:translateY(-18px);letter-spacing:7px}to{opacity:1;transform:translateY(0);letter-spacing:1px}}
@keyframes chest-subtitle-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes chest-spark-fly{0%{opacity:0;transform:translate(0,0) scale(.2)}12%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.05)}}
.case-overlay.legendary-hit.chest-cinematic:after{--chest-aura:#ffd36b38;animation-duration:7s}
.case-overlay.crystal-case-overlay.chest-cinematic{--chest-ring:#65d7ff;--chest-aura:#65d7ff24}
.case-overlay.crystal-case-overlay.chest-cinematic:after{--chest-aura:#a36dff35}
@media(prefers-reduced-motion:reduce){.case-overlay.chest-cinematic,.case-overlay.chest-cinematic:after,.case-overlay.chest-cinematic .case-opening-art,.case-overlay.chest-cinematic .case-opening-art:before,.case-overlay.chest-cinematic .case-heading,.case-overlay.chest-cinematic .case-subtitle,.chest-fx-spark{animation:none!important}}

/* Сундук: эффект прокрутки наград в стиле игровых кейсов */
.treasure-chest{font-size:88px;display:inline-block;filter:drop-shadow(0 0 10px #ffca4d99);animation:chest-float 2s ease-in-out infinite;transform-origin:50% 80%}
.treasure-chest:hover{filter:drop-shadow(0 0 22px #ffd36b)}
@keyframes chest-float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-7px) rotate(2deg)}}
@keyframes chest-open{0%{transform:scale(1) rotate(0);filter:drop-shadow(0 0 8px #ffd36b)}25%{transform:scale(1.12) rotate(-8deg)}50%{transform:scale(1.18) rotate(8deg);filter:drop-shadow(0 0 35px #fff0a6)}75%{transform:scale(1.12) rotate(-4deg)}100%{transform:scale(1) rotate(0)}}
.chest-opening{animation:chest-open .9s ease-in-out 2!important}
.reward-glow{color:#ffe08a;text-shadow:0 0 12px #ffb700,0 0 25px #ff8c00;animation:reward-pulse 1.1s ease-in-out infinite alternate}
@keyframes reward-pulse{from{transform:scale(1)}to{transform:scale(1.08)}}
.case-overlay{position:fixed;z-index:30;inset:0;background:radial-gradient(ellipse at center,#183440f5,#02070bf7 75%);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:18px;color:#fff;text-align:center}
.case-heading{font-weight:1000;font-size:21px;color:#ffd36b;letter-spacing:1px;margin-bottom:18px;text-shadow:0 0 18px #ffb52c66}
.case-track-wrap{position:relative;width:min(100%,440px);overflow:hidden;border:2px solid #b8873b;border-radius:12px;background:linear-gradient(180deg,#142a36,#050b12);box-shadow:0 0 22px #ffc24a22,inset 0 0 24px #000b;animation:reel-arrive .7s ease-out both}
.case-opening-art{font-size:64px;line-height:1;margin:0 0 12px;filter:drop-shadow(0 0 9px #ffca4d99);animation:case-chest-charge 1.1s ease-in-out infinite alternate}
.case-opening-art:after{content:"✦";position:absolute;font-size:24px;color:#fff0a1;text-shadow:0 0 15px #ffbd32;animation:case-spark 1.3s linear infinite}
@keyframes case-chest-charge{from{transform:translateY(0) scale(.96);filter:drop-shadow(0 0 8px #ffca4d66)}to{transform:translateY(-5px) scale(1.06);filter:drop-shadow(0 0 28px #ffca4d)}}
@keyframes case-spark{0%{transform:translate(28px,0) scale(.4);opacity:0}50%{opacity:1}100%{transform:translate(-26px,-30px) scale(1.1);opacity:0}}
@keyframes reel-arrive{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.case-track-wrap:before{content:"";position:absolute;z-index:2;left:50%;top:0;bottom:0;width:3px;transform:translateX(-50%);background:#fff5a5;box-shadow:0 0 12px 4px #ffb52c;pointer-events:none}
.case-track{display:flex;gap:8px;padding:12px;transform:translateX(0);will-change:transform}
.case-item{flex:0 0 94px;height:116px;border:1px solid #53717b;border-bottom:4px solid #78909c;border-radius:8px;background:linear-gradient(160deg,#263b48,#0d1b25);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:5px;overflow:hidden}
.case-item.rare{border-color:#5bb8ff;border-bottom-color:#5bb8ff;background:linear-gradient(160deg,#16456a,#0b1728);box-shadow:inset 0 0 18px #279dff35}.case-item.epic{border-color:#a66aff;border-bottom-color:#a66aff;background:linear-gradient(160deg,#42285f,#17172b)}.case-item.legendary{border-color:#ffbd42;border-bottom-color:#ffbd42;background:linear-gradient(160deg,#6a4316,#211a19);box-shadow:inset 0 0 18px #ffb52b22}
.case-item .case-icon{font-size:35px}.case-item small{font-size:9px;line-height:1.2;color:#e7e6df}
.case-subtitle{font-size:12px;color:#c3d2d8;margin:14px 0}.case-result{animation:case-result-pop .65s cubic-bezier(.18,.9,.25,1.3) both}.case-result-icon{font-size:76px;filter:drop-shadow(0 0 24px #ffcf56);animation:reward-pulse .8s infinite alternate}
@keyframes case-result-pop{from{opacity:0;transform:scale(.45) translateY(24px)}to{opacity:1;transform:scale(1) translateY(0)}}
.case-flash{position:fixed;z-index:31;inset:0;pointer-events:none;background:#fff4bf;animation:case-flash .65s ease-out forwards}@keyframes case-flash{0%{opacity:0}15%{opacity:.9}100%{opacity:0}}
.case-overlay.evo-hit{background:radial-gradient(ellipse at center,#174b59fa 0%,#21133afa 43%,#02030b 100%);overflow:hidden}
.case-overlay.evo-hit:before{content:"";position:absolute;inset:-50%;pointer-events:none;background:conic-gradient(from 0deg,transparent 0 5%,#8efff244 7%,transparent 12% 22%,#c28aff44 25%,transparent 30% 45%,#8efff244 48%,transparent 54%);animation:legendary-rays 3s linear infinite}
.case-overlay.evo-hit .case-heading{color:#d8fffb;text-shadow:0 0 12px #4bfff1,0 0 32px #a76aff;animation:legendary-title .45s ease-in-out infinite alternate}
.case-overlay.evo-hit .case-track-wrap{border-color:#8efff2;box-shadow:0 0 28px #4bfff1,0 0 65px #a76affaa}
/* Legendary reward reveal */
.case-overlay.legendary-hit{background:radial-gradient(ellipse at center,#5c3a0df7 0%,#190f25fa 48%,#020307 100%);overflow:hidden}
.case-overlay.legendary-hit:before{content:"";position:absolute;inset:-50%;pointer-events:none;background:conic-gradient(from 0deg,transparent 0 8%,#ffd56a20 10%,transparent 14% 25%,#fff1a633 27%,transparent 31% 45%,#ffb52c22 47%,transparent 52%);animation:legendary-rays 8s linear infinite}
.case-overlay.legendary-hit .case-heading{color:#fff0a3;font-size:clamp(21px,5vw,30px);text-shadow:0 0 10px #ffb52c,0 0 28px #ff8c00;animation:legendary-title .8s ease-in-out infinite alternate}
.case-overlay.legendary-hit .case-track-wrap{border-color:#ffe17a;box-shadow:0 0 18px #ffc34d,0 0 48px #ff9e1b88}
.case-result.legendary-result{position:relative;padding:18px 26px;border:2px solid #ffd36b;border-radius:18px;background:linear-gradient(145deg,#4b310deF,#140f1cF2);box-shadow:0 0 28px #ffc34d88,inset 0 0 30px #ffcf4b22;animation:legendary-arrive .8s cubic-bezier(.2,1.4,.3,1) both}
.legendary-result:before,.legendary-result:after{content:"✦  ✧  ✦  ✧  ✦";display:block;color:#ffe99b;letter-spacing:8px;font-size:16px;animation:legendary-title .6s ease-in-out infinite alternate}
.legendary-result .case-result-icon{font-size:clamp(78px,20vw,112px);filter:drop-shadow(0 0 12px #ffcf56) drop-shadow(0 0 36px #ff9d00);animation:legendary-icon .7s ease-in-out infinite alternate}
.legendary-banner{font-size:clamp(22px,6vw,34px);font-weight:1000;letter-spacing:2px;color:#fff1a8;text-shadow:0 0 8px #ffbd35,0 0 22px #ff8700;margin:5px 0 10px;animation:legendary-title .55s ease-in-out infinite alternate}
.legendary-particle{position:fixed;z-index:32;pointer-events:none;color:#ffdf72;text-shadow:0 0 10px #ffb52c;animation:particle-rise var(--dur,2s) ease-out forwards;font-size:var(--size,20px)}
@keyframes legendary-rays{to{transform:rotate(360deg)}}@keyframes legendary-title{from{filter:brightness(1);transform:scale(1)}to{filter:brightness(1.45);transform:scale(1.035)}}@keyframes legendary-arrive{0%{opacity:0;transform:scale(.2) rotate(-8deg)}65%{opacity:1;transform:scale(1.08) rotate(2deg)}100%{transform:scale(1) rotate(0)}}@keyframes legendary-icon{from{transform:scale(.96) rotate(-3deg)}to{transform:scale(1.08) rotate(3deg)}}@keyframes particle-rise{0%{opacity:0;transform:translateY(25px) scale(.4) rotate(0)}15%{opacity:1}100%{opacity:0;transform:translateY(-180px) scale(1.3) rotate(180deg)}}
@media(prefers-reduced-motion:reduce){.legendary-particle{display:none}.case-overlay.legendary-hit:before{animation:none}}
@media(prefers-reduced-motion:reduce){.treasure-chest,.chest-opening,.reward-glow,.case-result-icon{animation:none!important}.case-track{transition:none!important}}

/* Разные эффекты редкости наград */
.case-item.rare{border-color:#5bb8ff;box-shadow:inset 0 0 18px #279dff25}.case-item.epic{border-color:#bd72ff;box-shadow:inset 0 0 20px #9b36ff30}.case-item.legendary{border-color:#ffd45d;box-shadow:inset 0 0 24px #ffba2938;animation:gold-card-pulse 1.2s infinite alternate}
.case-result.rare-result{border:2px solid #5bb8ff;border-radius:16px;padding:16px;background:linear-gradient(145deg,#123c5c,#111b2b);box-shadow:0 0 25px #35aaff77}.case-result.epic-result{border:2px solid #bd72ff;border-radius:16px;padding:16px;background:linear-gradient(145deg,#381b56,#171426);box-shadow:0 0 28px #a53cff88}.case-result.rare-result .case-result-icon{filter:drop-shadow(0 0 20px #43baff)}.case-result.epic-result .case-result-icon{filter:drop-shadow(0 0 22px #bd72ff)}
@keyframes gold-card-pulse{from{box-shadow:inset 0 0 12px #ffba2922}to{box-shadow:inset 0 0 25px #ffba2988}}

.crystal-chest-panel{position:relative;overflow:hidden}.crystal-chest-panel:before{content:"";position:absolute;inset:-40%;pointer-events:none;background:conic-gradient(from 0deg,transparent 0 12%,#77d7ff13 15%,transparent 19% 32%,#b58aff17 36%,transparent 41%);animation:legendary-rays 16s linear infinite}.crystal-chest-art{position:relative;z-index:1;animation:crystal-float 2s ease-in-out infinite,crystal-glow 1.4s ease-in-out infinite alternate}.crystal-open-btn{display:block;width:100%;margin-top:12px}.crystal-results-grid{width:min(100%,600px);display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:10px;margin:16px 0;max-height:44vh;overflow:auto;padding:4px}.crystal-reward-card{min-width:0;opacity:0;animation:crystal-card-arrive .55s cubic-bezier(.2,1.4,.3,1) var(--delay,0s) forwards;border:1px solid #6aaed6;border-radius:13px;padding:13px 8px;background:linear-gradient(145deg,#163a59,#11182b);box-shadow:0 0 18px #45bfff25;display:flex;flex-direction:column;align-items:center;gap:8px}.crystal-reward-card.rare{border-color:#5bb8ff;box-shadow:0 0 20px #279dff66}.crystal-reward-card.epic{border-color:#bd72ff;background:linear-gradient(145deg,#43245d,#171426);box-shadow:0 0 25px #a53cff77}.crystal-reward-card.legendary{border-color:#ffd45d;background:linear-gradient(145deg,#654312,#211a19);box-shadow:0 0 30px #ffba29aa;animation:crystal-card-arrive .55s cubic-bezier(.2,1.4,.3,1) var(--delay,0s) forwards,gold-card-pulse 1s ease-in-out .6s infinite alternate}.crystal-card-icon{font-size:42px;filter:drop-shadow(0 0 12px #70d5ff)}.crystal-reward-card.legendary .crystal-card-icon{filter:drop-shadow(0 0 18px #ffcf56)}.crystal-reward-card b{font-size:13px;line-height:1.3}.crystal-reward-card small{font-size:10px;color:#c8e8ff}.crystal-case-overlay{background:radial-gradient(ellipse at center,#14385cf7,#030711fc 76%)}@keyframes crystal-float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}@keyframes crystal-glow{from{filter:drop-shadow(0 0 10px #37baff)}to{filter:drop-shadow(0 0 32px #a17cff)}}@keyframes crystal-card-arrive{from{opacity:0;transform:translateY(24px) scale(.6) rotate(-3deg)}to{opacity:1;transform:translateY(0) scale(1) rotate(0)}}

// Многослойные капли: каплевидные тела с бликом, мягкий короткий шлейф и брызги у земли.
(function initVolumetricRain(){
 const canvas=document.querySelector('.weather-rain-canvas'); if(!canvas)return;
 const ctx=canvas.getContext('2d'); let w=0,h=0,dpr=1,drops=[],splashes=[],raf=0,last=0;
 function resize(){const r=canvas.parentElement.getBoundingClientRect();dpr=Math.min(window.devicePixelRatio||1,2);w=Math.max(1,r.width);h=Math.max(1,r.height);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);const count=Math.round(w*h/950);drops=Array.from({length:count},()=>makeDrop(true));}
 function makeDrop(random=false){const depth=Math.random();return{x:Math.random()*w,y:random?Math.random()*h:-20-Math.random()*h*.25,depth,size:.65+depth*1.7,speed:3+depth*7,drift:1.1+depth*2.2,phase:Math.random()*Math.PI*2};}
 function draw(now){raf=requestAnimationFrame(draw);if(!document.querySelector('.app.weather-rain,.app.weather-storm')){ctx.clearRect(0,0,w,h);last=now;return;}const dt=Math.min(2,(now-(last||now))/16.67);last=now;ctx.clearRect(0,0,w,h);
  for(const d of drops){d.x-=d.drift*dt;d.y+=d.speed*dt;const len=(2+d.depth*5)*d.size;const x=d.x,y=d.y,r=(.65+d.depth*.85)*d.size;
   // очень короткий полупрозрачный шлейф, чтобы капли не выглядели палками
   ctx.beginPath();ctx.moveTo(x+1,y-len*.6);ctx.quadraticCurveTo(x+2.5,y-len*.1,x,y+r*1.1);ctx.strokeStyle=`rgba(177,216,244,${.08+d.depth*.17})`;ctx.lineWidth=.45+d.depth*.45;ctx.stroke();
   const g=ctx.createRadialGradient(x-r*.35,y-r*.45,.1,x,y,r*1.5);g.addColorStop(0,`rgba(246,253,255,${.38+d.depth*.34})`);g.addColorStop(.35,`rgba(174,218,247,${.22+d.depth*.28})`);g.addColorStop(1,'rgba(122,184,222,0)');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(x,y,r*.72,r*1.25,-.28,0,Math.PI*2);ctx.fill();
   // тонкий блик на капле
   ctx.beginPath();ctx.ellipse(x-r*.2,y-r*.22,r*.16,r*.38,-.35,0,Math.PI*2);ctx.fillStyle=`rgba(255,255,255,${.2+d.depth*.32})`;ctx.fill();
   if(d.y>h*.77&&Math.random()<.045*d.depth){splashes.push({x:d.x,y:Math.min(h-4,d.y),life:1,size:.8+d.depth*1.8});}
   if(d.y>h+8||d.x<-10)drops[drops.indexOf(d)]=makeDrop();
  }
  for(let i=splashes.length-1;i>=0;i--){const s=splashes[i];s.life-=.055*dt;ctx.beginPath();ctx.ellipse(s.x,s.y, s.size*(1.8-s.life),s.size*.45*(1.5-s.life),0,0,Math.PI*2);ctx.strokeStyle=`rgba(200,231,249,${Math.max(0,s.life)*.48})`;ctx.lineWidth=.7;ctx.stroke();if(s.life<=0)splashes.splice(i,1);}
 }
 resize();window.addEventListener('resize',resize,{passive:true});canvas.style.display='block';cancelAnimationFrame(raf);raf=requestAnimationFrame(draw);
})();

 };

function uploadProfileAvatar(input){

 if(file.size>8*1024*1024){message("Файл слишком большой","Выбери изображение размером до 8 МБ.");input.value="";return;}
 const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const canvas=document.createElement("canvas"),max=256;const scale=Math.min(1,max/Math.max(img.width,img.height));canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));const ctx=canvas.getContext("2d");ctx.drawImage(img,0,0,canvas.width,canvas.height);playerProfile.avatar=canvas.toDataURL("image/jpeg",0.82);savePlayerProfile();openProfile();renderAvatar(playerProfile.avatar);};img.onerror=()=>message("Не удалось открыть изображение","Попробуй выбрать другой файл.");img.src=reader.result;};reader.onerror=()=>message("Ошибка загрузки","Не удалось прочитать выбранный файл.");reader.readAsDataURL(file);input.value="";
}

// Онлайн-аккаунты, облачное сохранение и PvP через Socket.IO
const ONLINE_KEYS=['rcard_wallet','rcard_inventory','rcard_treasure_collection','rcard_equipped_gear','rcard_player_profile','rcard_mailbox','rcard_menu_weather'];
let onlineToken=localStorage.getItem('rcard_online_token')||'',onlineUser=null,onlineSocket=null,onlineDuelState=null,onlineSaveTimer=null;
function openOnline(){const m=document.getElementById('onlineModal');m.classList.remove('online-hidden');refreshOnlineUI();if(onlineToken)connectOnlineSocket();}
function closeOnline(){document.getElementById('onlineModal').classList.add('online-hidden')}
function onlineStatus(t){const el=document.getElementById('onlineStatus');if(el)el.textContent=t}
function refreshOnlineUI(){const logged=!!onlineToken&&!!onlineUser;document.getElementById('onlineAuth').classList.toggle('online-hidden',logged);document.getElementById('onlineLogged').classList.toggle('online-hidden',!logged);if(logged)document.getElementById('onlineAccountInfo').textContent=`👤 ${onlineUser.username}\n🏆 Рейтинг: ${onlineUser.rating} · Победы: ${onlineUser.wins} · Поражения: ${onlineUser.losses}`;}
async function onlineAuthSubmit(mode){const username=document.getElementById('onlineUsername').value.trim(),password=document.getElementById('onlinePassword').value;onlineStatus('Подключаемся к серверу…');try{const r=await fetch('/api/'+(mode==='register'?'register':'login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Не удалось войти.');onlineToken=data.token;onlineUser=data.user;localStorage.setItem('rcard_online_token',onlineToken);if(data.state&&Object.keys(data.state).length){ONLINE_KEYS.forEach(k=>{if(Object.prototype.hasOwnProperty.call(data.state,k))localStorage.setItem(k,JSON.stringify(data.state[k]));});location.reload();return;}await onlineSaveNow();refreshOnlineUI();connectOnlineSocket();onlineStatus(mode==='register'?'Аккаунт создан! Прогресс сохранён в облаке.':'Вход выполнен. Облачное сохранение подключено.');}catch(e){onlineStatus(e.message+' Убедись, что игра запущена на сервере RCard PvP Online.');}}
async function onlineSaveNow(){if(!onlineToken)return;const state={};ONLINE_KEYS.forEach(k=>{const v=localStorage.getItem(k);if(v!==null){try{state[k]=JSON.parse(v)}catch{}}});try{await fetch('/api/state',{method:'PUT',headers:{'Content-Type':'application/json','Authorization':'Bearer '+onlineToken},body:JSON.stringify({state})});}catch(e){}}
function scheduleOnlineSave(){if(!onlineToken)return;clearTimeout(onlineSaveTimer);onlineSaveTimer=setTimeout(onlineSaveNow,700)}
const originalSetItem=Storage.prototype.setItem;Storage.prototype.setItem=function(key,value){originalSetItem.call(this,key,value);if(ONLINE_KEYS.includes(String(key)))scheduleOnlineSave()};
async function onlineLogout(){if(onlineSocket)onlineSocket.disconnect();onlineSocket=null;onlineToken='';onlineUser=null;localStorage.removeItem('rcard_online_token');document.getElementById('onlineDuel').classList.add('online-hidden');refreshOnlineUI();onlineStatus('Ты вышел из аккаунта. Локальное сохранение на этом устройстве не удалено.');}
function connectOnlineSocket(){if(!onlineToken||onlineSocket||typeof io!=='function'){if(typeof io!=='function')onlineStatus('Серверная часть не подключена. Запусти игру командой npm start на хостинге Node.js.');return;}onlineSocket=io({auth:{token:onlineToken}});onlineSocket.on('connect',()=>onlineStatus('🟢 Подключено к онлайн-серверу.'));onlineSocket.on('connect_error',()=>onlineStatus('Не удалось подключиться к онлайн-серверу. Проверь интернет и сервер.'));onlineSocket.on('online:error',d=>onlineStatus(d.message));onlineSocket.on('online:ready',d=>{onlineUser=d.user;refreshOnlineUI()});onlineSocket.on('match:queued',()=>onlineStatus('⏳ Ищем соперника… Оставь это окно открытым.'));onlineSocket.on('match:cancelled',()=>onlineStatus('Поиск отменён.'));onlineSocket.on('match:found',d=>{onlineDuelState=d;document.getElementById('onlineDuel').classList.remove('online-hidden');document.getElementById('onlineDuelTitle').textContent='⚔ Соперник найден!';document.getElementById('onlineDuelLog').textContent='Первый ход у '+(d.players.find(p=>p.id===d.turn)?.username||'соперника');renderOnlineDuel();onlineStatus('Матч начался! Атакуй по очереди.');});onlineSocket.on('duel:update',d=>{if(!onlineDuelState)return;onlineDuelState.hp=d.hp;onlineDuelState.turn=d.turn;document.getElementById('onlineDuelLog').textContent=`${d.attackerName} нанёс ${d.damage} урона!`;renderOnlineDuel()});onlineSocket.on('duel:message',d=>onlineStatus(d.message));onlineSocket.on('duel:finished',d=>{document.getElementById('onlineDuelLog').textContent=(d.winnerId===onlineUser?.id?'🏆 Ты победил! ':'💥 Ты проиграл. ')+`Победитель: ${d.winner}`;onlineDuelState=null;if(onlineUser&&d.ratings?.[onlineUser.id]!=null){onlineUser.rating=d.ratings[onlineUser.id];if(d.winnerId===onlineUser.id)onlineUser.wins++;else onlineUser.losses++;refreshOnlineUI()}onlineStatus('Матч завершён. Нажми «Найти соперника», чтобы сыграть снова.');});}
function onlineFindMatch(){if(!onlineToken){onlineStatus('Сначала создай аккаунт или войди.');return;}connectOnlineSocket();if(onlineSocket)onlineSocket.emit('match:join');}
function onlineAttack(){if(onlineSocket)onlineSocket.emit('duel:attack')}
function renderOnlineDuel(){if(!onlineDuelState)return;const box=document.getElementById('onlineDuelPlayers');box.innerHTML=onlineDuelState.players.map(p=>{const hp=onlineDuelState.hp[p.id]??100;return `<div class="online-player"><b>${p.id===onlineUser?.id?'🟢 Ты':'🥷 '+p.username}</b><div class="online-hp"><span style="width:${hp}%"></span></div><small>HP: ${hp}/100 · Рейтинг ${p.rating}</small></div>`}).join('');const attack=document.querySelector('#onlineDuel button.primary');if(attack){attack.disabled=onlineDuelState.turn!==onlineUser?.id;attack.textContent=attack.disabled?'⌛ ХОД СОПЕРНИКА':'⚡ АТАКОВАТЬ';}}
async function onlineLeaderboard(){try{const r=await fetch('/api/leaderboard');const d=await r.json();onlineStatus('🏆 РЕЙТИНГ ИГРОКОВ\n'+(d.players.length?d.players.slice(0,15).map((p,i)=>`${i+1}. ${p.username} — ${p.rating} очков · ${p.wins} побед`).join('\n'):'Пока игроков нет.'));}catch(e){onlineStatus('Не удалось загрузить рейтинг.');}}
if(onlineToken){fetch('/api/me',{headers:{Authorization:'Bearer '+onlineToken}}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{onlineUser=d.user;refreshOnlineUI()}).catch(()=>{onlineToken='';localStorage.removeItem('rcard_online_token');refreshOnlineUI()});}
home();update();updateMailBadge();applyWeather(currentWeather);const savedAvatarButton=document.querySelector(".profile-trigger");if(savedAvatarButton)savedAvatarButton.innerHTML=avatarMarkup(playerProfile.avatar);applyFrameClasses();
</script></body></html>
